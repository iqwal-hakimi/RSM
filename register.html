<!-- Register Header -->

<section class="register-header">


<h1>Become A Volunteer</h1>


<p>
Join Rakan Sukarela Muda and make a positive impact
in your community.
</p>


</section>





<!-- Registration Form -->


<section class="register">


<form>


<label>
Full Name
</label>

<input 
type="text" 
placeholder="Enter your name">





<label>
Age
</label>

<input 
type="number" 
placeholder="Enter your age">





<label>
Email
</label>

<input 
type="email" 
placeholder="Enter your email">





<label>
Phone Number
</label>

<input 
type="tel" 
placeholder="Enter phone number">





<label>
Volunteer Interest
</label>


<select>

<option>
Choose activity
</option>

<option>
Community Service
</option>

<option>
Environmental Program
</option>

<option>
Education Support
</option>

<option>
Youth Leadership
</option>

</select>





<label>
Why do you want to join RSM?
</label>


<textarea 
rows="5"
placeholder="Write your message">
</textarea>





<button type="submit">
Register Now
</button>


</form>


</section>
